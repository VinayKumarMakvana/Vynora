<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vynoraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <g transform="translate(10, 20)">
    <!-- V Icon -->
    <path d="M 10,10 L 30,50 L 50,10" fill="none" stroke="url(#vynoraGradient)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="30" cy="50" r="4" fill="#38bdf8" filter="url(#glow)"/>
    
    <!-- Text -->
    <text x="70" y="45" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="#f8fafc" letter-spacing="4">VYNORA</text>
    <text x="260" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#818cf8">.ai</text>
  </g>
</svg>
